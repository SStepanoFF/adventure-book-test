openapi: 3.0.3
info:
  title: Adventure Book API
  description: >
    Backend API for the Adventure Book application. This document is the primary reference
    for API-level testing.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
    description: Local backend (default port)

paths:
  /api/books:
    get:
      summary: List books in the catalog (Objective 1)
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Case-insensitive substring match against title or author.
        - name: tag
          in: query
          schema:
            type: string
          description: Exact, case-insensitive match against one of the book's tags.
      responses:
        "200":
          description: Matching books.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookSummary"
    post:
      summary: Add a new book to the catalog (Objective 5)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookInput"
      responses:
        "201":
          description: The book was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSummary"
        "400":
          description: The book failed structural validation, or the request body failed field validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/books/{bookId}:
    get:
      summary: Get a single book's catalog summary
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The book summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookSummary"
        "404":
          description: No book exists with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/games:
    post:
      summary: Start a new game session for a book (Objective 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookId]
              properties:
                bookId:
                  type: integer
                  format: int64
      responses:
        "201":
          description: A new game session, positioned at the book's BEGIN section, with full health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "404":
          description: No book exists with the given id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/games/{sessionId}:
    get:
      summary: Get the current state of a game session
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The current game state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "404":
          description: No session exists with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/games/{sessionId}/choices/{optionIndex}:
    post:
      summary: Submit a choice for the current section (Objectives 2-3)
      description: >
        Applies the chosen option's consequence (if any), advances to the target section, and
        recomputes health and game status. Returns 409 if the session has already ended
        (DEAD or FINISHED), and 400 if the option index does not exist for the current section.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: optionIndex
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The updated game state after the choice was resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "400":
          description: The option index is not valid for the current section.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No session exists with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The session has already ended; no further choices can be made.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/games/{sessionId}/save:
    post:
      summary: Explicitly save a game session (Objective 4)
      description: >
        Session state is already persisted after every mutation; this endpoint re-confirms the
        save and returns the persisted state, giving the frontend an explicit, testable save
        action.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The persisted game state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "404":
          description: No session exists with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/games/{sessionId}/restart:
    post:
      summary: Restart a game session from the book's beginning
      description: >
        Resets the session back to the book's BEGIN section with full health and status
        IN_PROGRESS, regardless of the session's current status (including DEAD or FINISHED) -
        lets a player replay the same book without starting a brand new session.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: The reset game state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "404":
          description: No session exists with this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/test/reset:
    post:
      summary: Reset backend state (test-only support endpoint)
      description: >
        Not part of the functional spec. Deletes all game sessions and restores the book catalog
        to exactly the seed books loaded at boot, so automated suites can reset state between
        runs without restarting the backend. Returns 404 if disabled via the
        `app.test-support.reset-enabled` property.
      responses:
        "204":
          description: State was reset.
        "404":
          description: The reset endpoint is disabled.

components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    BookSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        author:
          type: string
        description:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
          nullable: true
        sectionCount:
          type: integer

    BookInput:
      type: object
      required: [title, author, sections]
      properties:
        title:
          type: string
        author:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        sections:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SectionInput"

    SectionInput:
      type: object
      required: [id, text, type]
      properties:
        id:
          type: integer
        text:
          type: string
        type:
          $ref: "#/components/schemas/SectionType"
        options:
          type: array
          items:
            $ref: "#/components/schemas/OptionInput"

    OptionInput:
      type: object
      required: [description, gotoId]
      properties:
        description:
          type: string
        gotoId:
          type: integer
          description: Id of the section this option leads to. Must exist within the same book.
        consequence:
          $ref: "#/components/schemas/ConsequenceInput"

    ConsequenceInput:
      type: object
      required: [type, value]
      properties:
        type:
          $ref: "#/components/schemas/ConsequenceType"
        value:
          type: string
          description: Magnitude of the effect, as a string (e.g. "6").
        text:
          type: string
          description: Flavor text shown once the consequence is applied.

    SectionType:
      type: string
      enum: [BEGIN, NODE, END]

    ConsequenceType:
      type: string
      enum: [LOSE_HEALTH]

    GameStatus:
      type: string
      enum: [IN_PROGRESS, DEAD, FINISHED]

    OptionView:
      type: object
      properties:
        index:
          type: integer
          description: Position of this option in the current section; use to submit a choice.
        description:
          type: string
        hasConsequence:
          type: boolean
          description: >
            Whether choosing this option triggers a consequence. The consequence's magnitude and
            narrative text are intentionally not revealed until the choice is made.

    SectionView:
      type: object
      properties:
        id:
          type: integer
        text:
          type: string
        type:
          $ref: "#/components/schemas/SectionType"
        options:
          type: array
          items:
            $ref: "#/components/schemas/OptionView"

    ConsequenceView:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/ConsequenceType"
        value:
          type: integer
        text:
          type: string

    GameState:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        bookId:
          type: integer
          format: int64
        bookTitle:
          type: string
        health:
          type: integer
        maxHealth:
          type: integer
          description: Starting/maximum health, computed by the backend - the frontend should
            never hardcode this value.
        status:
          $ref: "#/components/schemas/GameStatus"
        gameOver:
          type: boolean
          description: >
            True when status is anything other than IN_PROGRESS (DEAD or FINISHED). Computed by
            the backend so clients never need to know which status values mean "the game has
            ended".
        currentSection:
          $ref: "#/components/schemas/SectionView"
        lastConsequence:
          $ref: "#/components/schemas/ConsequenceView"
          nullable: true

    ApiError:
      type: object
      properties:
        message:
          type: string
        details:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time
