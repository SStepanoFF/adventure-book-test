# Sequential by default:  mvn test
# Parallel (test CLASSES run concurrently, the methods of one class run on one thread):
#   mvn test -Djunit.jupiter.execution.parallel.enabled=true
# Why classes and not methods: Playwright objects are bound to the thread that created them, so every class
# gets its own browser, created and closed by one thread (see BrowserManager, ui.browser-scope).
junit.jupiter.execution.parallel.enabled=false
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=4
