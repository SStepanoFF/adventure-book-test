# Defaults shared by every environment. Anything can be overridden per environment file,
# by an environment variable (api.base-url -> API_BASE_URL) or by -Dapi.base-url=...
api.base-url=http://localhost:8080
ui.base-url=http://localhost:4200
openapi.spec=openapi/openapi.yaml
# REST Assured's standard request/response log: all | failures | none
api.log=all

ui.browser=chromium
ui.headless=true
ui.slow-mo-ms=0
ui.timeout-ms=10000
ui.video=false
# install ONLY the selected browser, ONLY if it is missing
ui.auto-install-browser=true
# run | class | auto (auto = close browsers per class when JUnit parallel execution is on)
ui.browser-scope=auto

# Calls POST /api/test/reset once before the whole run (disable on environments where it is not allowed)
test.reset-on-start=true

# true = the run fails if an endpoint has no happy-path call or no contract-validated call (full runs only)
coverage.enforce=false

perf.page-ready-budget-ms=500
perf.runs=5
